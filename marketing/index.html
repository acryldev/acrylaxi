<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ACRYL AXI — explainer</title>
    <link rel="stylesheet" href="assets/brand.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }
      /* The root is a pure stage: every pixel comes from a scene host. */
      #root > [data-composition-src] {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="72"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="s1"
        data-composition-id="s1"
        data-composition-src="compositions/s1-problem.html"
        data-start="0"
        data-duration="9.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s2"
        data-composition-id="s2"
        data-composition-src="compositions/s2-turn.html"
        data-start="9.5"
        data-duration="9.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s3"
        data-composition-id="s3"
        data-composition-src="compositions/s3-loop.html"
        data-start="19"
        data-duration="9.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s4"
        data-composition-id="s4"
        data-composition-src="compositions/s4-regenerate.html"
        data-start="28.5"
        data-duration="10"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s5"
        data-composition-id="s5"
        data-composition-src="compositions/s5-why.html"
        data-start="38.5"
        data-duration="10.5"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s6"
        data-composition-id="s6"
        data-composition-src="compositions/s6-capabilities.html"
        data-start="49"
        data-duration="12.5"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s7"
        data-composition-id="s7"
        data-composition-src="compositions/s7-close.html"
        data-start="61.5"
        data-duration="10.5"
        data-track-index="7"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      // Root timeline exists so the runtime has a clock to drive; every scene
      // owns its own paused timeline and is driven by the runtime.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
